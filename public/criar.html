<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abra as portas do seu escritório virtual</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%239b6bd6%22/%3E%3C/svg%3E">
<style>
:root{--ink:#f6f2fb;--soft:#cfc6de;--mute:#9a90ae;--accent:#b68cf0;--accent2:#e3cdfd;--glass:rgba(20,16,32,.62);--line:rgba(255,255,255,.14);--ok:#7ff0a8}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#07060b;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#rgl,#fgl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:0;touch-action:none;transition:opacity .5s}
.some{opacity:0;pointer-events:none}
#rtag{position:fixed;left:0;top:0;pointer-events:none;background:rgba(20,17,31,.8);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap;transition:opacity .6s}
#rtag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok)}
.veil{position:fixed;inset:0;background:#07060b;pointer-events:none;transition:opacity 1.6s ease}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,6,11,0) 30%,rgba(7,6,11,.78) 62%,rgba(7,6,11,.94) 100%)}
.shade.faixa{background:linear-gradient(180deg,rgba(7,6,11,.82) 0%,rgba(7,6,11,0) 34%,rgba(7,6,11,0) 50%,rgba(7,6,11,.93) 100%)}
.shade.catalogo{background:rgba(9,7,15,.9)}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:18px 24px;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.18em;font-size:11.5px;color:var(--accent2)}
.brand i{width:9px;height:9px;transform:rotate(45deg);background:var(--accent);display:inline-block;box-shadow:0 0 14px var(--accent)}
.prog{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;max-width:360px;margin-left:auto}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.2,.7,.2,1)}
#stage{position:fixed;top:0;right:0;bottom:0;width:min(540px,48vw);display:flex;align-items:center;padding:84px clamp(22px,4vw,56px) 40px;z-index:2;overflow:auto;transition:width .7s cubic-bezier(.2,.7,.2,1)}
#stage.wide{width:min(680px,56vw)}
#stage{overflow:hidden}
#stage.faixa,#stage.catalogo{left:0;width:100%;align-items:stretch;padding:76px clamp(18px,3vw,44px) 22px}
#stage.faixa .turn,#stage.catalogo .turn{display:flex;flex-direction:column;height:100%;margin:0;min-height:0}
#stage.faixa .body,#stage.catalogo .body{flex:1;display:flex;flex-direction:column;min-height:0}
#stage.faixa h1,#stage.catalogo h1{max-width:760px;font-size:clamp(24px,3vw,38px)}
#stage.faixa .sub,#stage.catalogo .sub{margin-bottom:10px}
#stage.faixa .cards{margin-top:auto}
#stage.faixa .nav,#stage.catalogo .nav{margin-top:14px}
.cards.c4{grid-template-columns:repeat(4,1fr);max-width:1180px;width:100%}
.cards.c4 .card img{aspect-ratio:16/8}.cards.c4 .tx{padding:9px 12px 11px}
.cat{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;max-width:1280px;width:100%;margin:6px auto 0;align-items:stretch}
.turn{width:100%;margin:auto 0;animation:in .7s cubic-bezier(.2,.7,.2,1) both}
.turn.out{animation:out .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-16px)}}
.who{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:14px}
.who i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font:500 clamp(27px,3.5vw,42px)/1.14 Georgia,"Times New Roman",serif;margin:0 0 10px;letter-spacing:-.01em;min-height:1.14em}
h1 em{font-style:normal;color:var(--accent2)}
.sub{color:var(--soft);font-size:16px;margin:0 0 22px;max-width:460px}
.body{transition:opacity .6s ease,transform .6s ease}.body.wait{opacity:0;transform:translateY(10px);pointer-events:none}
.line{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.28);color:var(--ink);font:500 clamp(20px,2.3vw,26px)/1.3 system-ui,sans-serif;padding:10px 2px;outline:0;border-radius:0;transition:border-color .3s}
.line:focus{border-color:var(--accent)}.line::placeholder{color:rgba(255,255,255,.3)}
textarea.line{resize:none;min-height:92px;font-size:clamp(17px,1.8vw,20px);font-weight:400}
.mini{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(182,140,240,.16);border:1px solid rgba(182,140,240,.45);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;animation:in .4s both}
.chip button{background:rgba(255,255,255,.12);border:0;color:var(--ink);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;font-size:13px}
.cards{display:grid;gap:12px}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c2{grid-template-columns:1fr 1fr}
.card{position:relative;background:var(--glass);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;padding:0;backdrop-filter:blur(10px);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px)}
.card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(182,140,240,.22),0 18px 50px rgba(0,0,0,.5)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.card .tx{padding:11px 13px 13px}.card b{display:block;font-size:15px}.card span{color:var(--soft);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:rgba(10,8,16,.75);color:var(--accent2);backdrop-filter:blur(6px)}
.badge.gold{color:#ffdf9a}
.ag{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:12px;backdrop-filter:blur(10px);transition:border-color .3s,background .3s;animation:in .6s both}
.ag.on{border-color:rgba(182,140,240,.7);background:rgba(34,26,54,.72)}
.ag img{width:62px;height:76px;object-fit:cover;border-radius:12px;background:linear-gradient(160deg,#2c2444,#1b1729);transition:filter .4s}.ag:not(.on) img{filter:grayscale(1) opacity(.55)}
.ag h3{margin:0;font-size:15.5px}.ag p{margin:1px 0 0;color:var(--soft);font-size:12.5px;line-height:1.4}
.ag .more{grid-column:2/-1;display:grid;gap:8px;margin-top:4px}
.ag input.nm{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.22);color:var(--ink);font:600 14px system-ui,sans-serif;padding:4px 0;outline:0;max-width:220px}.ag input.nm:focus{border-color:var(--accent)}
.fn{display:flex;flex-wrap:wrap;gap:6px}
.fn button{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--soft);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;transition:all .25s}
.fn button[aria-pressed=true]{background:rgba(182,140,240,.2);border-color:var(--accent);color:var(--ink)}
.tg{appearance:none;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;transition:background .3s;margin:2px 0 0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tg:checked{background:var(--accent)}.tg:checked::after{transform:translateX(18px)}.tg:disabled{opacity:.6;cursor:default}
.nav{display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.go{background:linear-gradient(135deg,#a676ea,#8a5fd0);border:0;border-radius:999px;padding:13px 26px;font:inherit;font-weight:600;color:#fff;cursor:pointer;box-shadow:0 10px 34px rgba(138,95,208,.45);transition:transform .25s,box-shadow .25s}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(138,95,208,.6)}.go:disabled{opacity:.6;cursor:wait;transform:none}
.back,.skip{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;padding:8px 4px}.back:hover,.skip:hover{color:var(--ink)}
.key{font-size:12px;color:var(--mute)}.key kbd{font:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px}
.err{color:#ffb9b9;font-size:14px;min-height:20px;margin:12px 0 0}
.drop{display:flex;align-items:center;gap:14px;border:1.5px dashed rgba(255,255,255,.3);border-radius:16px;padding:18px;cursor:pointer;background:var(--glass);backdrop-filter:blur(10px);transition:border-color .3s}
.drop:hover{border-color:var(--accent)}.drop img{height:52px;max-width:170px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
.addr{display:flex;align-items:baseline;gap:2px;font-size:15px;color:var(--soft);margin-top:6px;flex-wrap:wrap}
.addr input{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.28);color:var(--accent2);font:600 15px system-ui,sans-serif;outline:0;padding:2px 0;min-width:120px}
.build{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;font-size:17px;color:var(--soft)}
.build li{opacity:0;transform:translateX(-8px);transition:all .6s}.build li.on{opacity:1;transform:none}.build li.ok{color:var(--ok)}
a.go{text-decoration:none;display:inline-block}

.cat{align-items:center}
.vc{position:relative;display:flex;flex-direction:column;background:rgba(26,21,42,.82);border:1.5px solid var(--line);border-radius:22px;padding:12px 12px 14px;backdrop-filter:blur(12px);transition:border-color .35s,transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .35s;animation:in .7s backwards}
.vc.on{border-color:rgba(182,140,240,.85);box-shadow:0 20px 54px rgba(0,0,0,.5),0 0 0 3px rgba(182,140,240,.14)}
.vc:hover{transform:translateY(-4px)}
.vc .foto{position:relative;height:210px;border-radius:16px;background:radial-gradient(ellipse at 50% 28%,#40336a,#17132a 78%);display:grid;place-items:end center;overflow:hidden;flex:none}
.vc .foto.ultra{background:radial-gradient(ellipse at 50% 25%,#5a4a2a,#1a1410 80%)}
.vc .foto img{height:96%;width:100%;object-fit:contain;object-position:center bottom;display:block;transition:opacity .4s}
.vc:not(.on) .foto img{opacity:.45}
.vc .foto img.sil{filter:brightness(0);opacity:.5}
.selo{position:absolute;top:10px;left:10px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:rgba(10,8,16,.78);color:#ffdf9a}
.vc .cargo{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-top:12px}
.vc .nome{font:600 19px Georgia,serif;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .fr{color:var(--soft);font-size:13px;line-height:1.4;margin:6px 0 0;min-height:36px}
.acoes{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;position:relative;z-index:2}
.add,.det,.fixo{border-radius:999px;padding:9px 12px;font:inherit;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .25s;white-space:nowrap}
.add{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:var(--ink)}.add:hover{border-color:var(--accent)}
.add.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fixo{border:1.5px solid rgba(127,240,168,.4);color:var(--ok);cursor:default}
.det{background:rgba(255,255,255,.08);border:1.5px solid transparent;color:var(--soft)}.det:hover{color:var(--ink);background:rgba(255,255,255,.14)}
/* linha de pontos para escolher a fachada */
.rail{position:absolute;right:clamp(20px,4.5vw,72px);top:50%;transform:translateY(-50%);display:grid;justify-items:end}
.rail::before{content:"";position:absolute;right:8px;top:26px;bottom:26px;width:2px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.35),rgba(255,255,255,.05))}
.pt{position:relative;display:grid;grid-template-columns:auto 18px;align-items:center;gap:16px;background:none;border:0;color:var(--soft);font:inherit;text-align:right;padding:15px 0;cursor:pointer}
.pt i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:#141020;justify-self:center;transition:all .35s cubic-bezier(.2,.7,.2,1)}
.pt b{display:block;font-size:15px;font-weight:600;transition:color .3s;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.pt span{display:block;max-width:230px;font-size:12.5px;line-height:1.4;color:var(--soft);max-height:0;opacity:0;overflow:hidden;transition:all .45s;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.pt:hover i{border-color:var(--accent2);transform:scale(1.2)}.pt:hover b{color:var(--ink)}
.pt[aria-pressed=true] i{width:18px;height:18px;background:var(--accent);border-color:#fff;box-shadow:0 0 0 6px rgba(182,140,240,.25),0 0 24px var(--accent)}
.pt[aria-pressed=true] b{color:var(--ink);font-size:18px;font-family:Georgia,serif}
.pt[aria-pressed=true] span{max-height:60px;opacity:1;margin-top:3px}
#stage.trilho{left:0;width:100%;align-items:stretch;padding:76px clamp(18px,3vw,44px) 22px}
#stage.trilho .turn{display:flex;flex-direction:column;height:100%;margin:0}#stage.trilho .body{flex:1;display:flex;flex-direction:column}#stage.trilho .nav{margin-top:auto}
#stage.trilho h1{max-width:640px;font-size:clamp(24px,3vw,38px)}
.shade.trilho{background:linear-gradient(180deg,rgba(7,6,11,.8) 0%,rgba(7,6,11,0) 32%,rgba(7,6,11,0) 62%,rgba(7,6,11,.75) 100%),linear-gradient(270deg,rgba(7,6,11,.7) 0%,rgba(7,6,11,0) 30%)}
/* ficha detalhada do agente */
.sheetbg{position:fixed;inset:0;z-index:5;background:rgba(6,5,10,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(900px,100%);max-height:100%;overflow:auto;background:#17132a;border:1px solid rgba(182,140,240,.4);border-radius:24px;padding:26px;display:grid;grid-template-columns:260px 1fr;gap:26px;box-shadow:0 40px 120px rgba(0,0,0,.7);animation:in .5s cubic-bezier(.2,.7,.2,1) both}
.sheet .foto{height:260px;border-radius:18px;background:radial-gradient(ellipse at 50% 28%,#40336a,#17132a 78%);display:grid;place-items:end center;overflow:hidden;position:relative}.sheet .foto.ultra{background:radial-gradient(ellipse at 50% 25%,#5a4a2a,#1a1410 80%)}
.sheet .foto img{height:96%;width:100%;object-fit:contain;object-position:center bottom}.sheet .foto img.sil{filter:brightness(0);opacity:.5}
.sheet .cargo{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-top:14px}
.sheet input.nm{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.25);color:var(--ink);font:600 22px Georgia,serif;padding:3px 0;outline:0;width:100%}.sheet input.nm:focus{border-color:var(--accent)}
.sheet p{margin:8px 0 0;color:var(--soft);font-size:14px;line-height:1.5}
.sheet h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sheet section{margin-bottom:18px}
.hab{display:grid;gap:6px}
.hab button{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:12px;color:var(--soft);font:inherit;font-size:14px;padding:9px 12px;cursor:pointer;transition:all .25s}
.hab button::before{content:"";width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);transition:all .25s}
.hab button[aria-pressed=true]{background:rgba(182,140,240,.14);border-color:rgba(182,140,240,.5);color:var(--ink)}
.hab button[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px #17132a}
.lim{margin:0;padding:0;list-style:none;display:grid;gap:6px}.lim li{position:relative;padding-left:20px;color:var(--soft);font-size:13.5px;line-height:1.45}.lim li::before{content:"";position:absolute;left:2px;top:8px;width:8px;height:2px;background:#ffb9b9;border-radius:2px}
.sheet .x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--mute);font-size:26px;cursor:pointer;line-height:1}.sheet .x:hover{color:var(--ink)}
.sheet .acoes{grid-template-columns:auto auto;justify-content:start;margin-top:4px}
@media(max-height:740px){h1{font-size:clamp(22px,3vw,32px)}.sub{font-size:14px;margin-bottom:12px}.nav{margin-top:14px}.lbl{margin-top:10px}.line{padding:6px 2px}#stage{padding-top:70px;padding-bottom:18px}}
@media(max-width:860px){
  #stage{overflow:auto}
  .cat{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:4px;align-items:stretch}.vc{flex:0 0 72vw;scroll-snap-align:center}.vc .foto{height:26vh}
  #stage.trilho{top:0;max-height:none;padding:64px 16px calc(16px + env(safe-area-inset-bottom));overflow:hidden}
  .rail{position:static;transform:none;display:flex;gap:4px;justify-content:space-between;margin-top:auto;width:100%}.rail::before{display:none}.pt{grid-template-columns:1fr;justify-items:center;text-align:center;gap:6px;padding:8px 4px;flex:1}.pt i{order:-1}.pt span{display:none}.pt b,.pt[aria-pressed=true] b{font-size:12.5px;font-family:inherit}
  #stage.trilho .nav{margin-top:12px}
  .sheet{grid-template-columns:1fr;padding:18px}.sheet .foto{height:180px}
  .cards.c4{grid-template-columns:repeat(4,62vw);overflow-x:auto;scroll-snap-type:x mandatory}.cards.c4 .card{scroll-snap-align:center}
  #stage.faixa,#stage.catalogo{top:0;max-height:none;padding:64px 16px calc(16px + env(safe-area-inset-bottom));overflow:hidden}
  .shade.faixa{background:linear-gradient(180deg,rgba(7,6,11,.85) 0%,rgba(7,6,11,.1) 34%,rgba(7,6,11,.1) 44%,rgba(7,6,11,.95) 100%)}
  .shade{background:linear-gradient(180deg,rgba(7,6,11,0) 28%,rgba(7,6,11,.86) 52%,rgba(7,6,11,.97) 100%)}
  #stage,#stage.wide{top:auto;left:0;width:auto;max-height:66vh;align-items:flex-start;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
  .cards.c3{grid-template-columns:repeat(3,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}.cards.c2{grid-template-columns:1fr 1fr}
  .top{padding:14px 16px}.prog{max-width:none}
}
@media(prefers-reduced-motion:reduce){.turn,.turn.out,.chip,.ag{animation:none}.veil,.card,.go,.body{transition:none}.who i{animation:none}}
</style>
</head>
<body>
<canvas id="fgl" aria-hidden="true"></canvas>
<canvas id="rgl" class="some" aria-hidden="true"></canvas>
<div id="rtag" hidden><i></i><span id="rtagn"></span></div>
<div class="veil" id="veil" style="opacity:.78"></div>
<div class="shade" id="shade"></div>
<header class="top"><div class="brand"><i></i>VENUS TECNOLOGIA</div><div class="prog" role="progressbar" aria-label="Progresso"><i id="bar"></i></div></header>
<main id="stage" aria-live="polite"></main>
<script src="/criar.js"></script>
<script type="module" src="/fachada3d.js"></script>
<script type="module" src="/recepcao3d.js"></script>
</body>
</html>
